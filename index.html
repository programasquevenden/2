<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REFLEX PING PONG</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2218%22%20fill%3D%22hsl%28240%2C100%25%2C15%25%29%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2266%22%20font-family%3D%22monospace%22%20font-weight%3D%22bold%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%3E%3Ctspan%20fill%3D%22hsl%2860%2C100%25%2C50%25%29%22%3ER%3C/tspan%3E%3Ctspan%20fill%3D%22hsl%28300%2C100%25%2C50%25%29%22%3EP%3C/tspan%3E%3Ctspan%20fill%3D%22hsl%28180%2C100%25%2C50%25%29%22%3EP%3C/tspan%3E%3C/text%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: hsl(240, 100%, 15%);
    overflow: hidden;
    touch-action: none;
    font-family: monospace;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: row;
  }
  .side-panel {
    width: 72px;
    flex: 0 0 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    box-sizing: border-box;
    position: relative;
  }
  .side-panel::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: hsla(240, 100%, 85%, 0.25);
  }
  #panel-left::before { right: 0; }
  #panel-right::before { left: 0; }

  .score {
    font-size: 34px;
    font-weight: bold;
    line-height: 1;
    text-shadow: 0 0 10px currentColor;
  }
  .score-cyan { color: hsl(180, 100%, 50%); }
  .score-magenta { color: hsl(300, 100%, 50%); }

  .speed-label {
    font-size: 9px;
    letter-spacing: 1px;
    color: hsla(240, 100%, 85%, 0.6);
    margin-bottom: 6px;
    writing-mode: vertical-rl;
  }
  .speed-meter {
    width: 8px;
    height: 140px;
    border: 1px solid hsla(240, 100%, 85%, 0.4);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    background: hsla(240, 100%, 85%, 0.05);
  }
  .speed-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: hsl(60, 100%, 50%);
    transition: height 0.08s linear;
  }

  .deco-dots {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .deco-dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: hsla(240, 100%, 85%, 0.3);
    display: block;
  }

  #center {
    flex: 1;
    position: relative;
  }

  #menu {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    color: hsl(240, 100%, 85%);
    z-index: 10;
    background: hsl(240, 100%, 15%);
  }
  .screen-title {
    font-weight: bold;
    letter-spacing: 3px;
    font-size: 14vw;
    margin: 0;
    text-align: center;
    line-height: 1.1;
  }
  #menu .subtitle {
    font-size: 16px;
    letter-spacing: 2px;
  }
  .choice-row {
    display: flex;
    gap: 20px;
  }
  .choice-btn {
    padding: 14px 28px;
    font-family: monospace;
    font-size: 16px;
    letter-spacing: 2px;
    background: transparent;
    border: 2px solid;
    cursor: pointer;
  }
  #btn-cyan {
    color: hsl(180, 100%, 50%);
    border-color: hsl(180, 100%, 50%);
  }
  #btn-magenta {
    color: hsl(300, 100%, 50%);
    border-color: hsl(300, 100%, 50%);
  }
  #canvas-wrap {
    position: absolute;
    inset: 0;
    display: none;
  }
  canvas {
    display: block;
  }
  #serve-hint {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: hsla(240, 100%, 85%, 0.6);
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<div id="app">
  <div class="side-panel" id="panel-left">
    <div class="score score-cyan" id="score-cyan">0</div>
    <div class="deco-dots">
      <span></span><span></span><span></span>
    </div>
    <div class="score score-magenta" id="score-magenta">0</div>
  </div>

  <div id="center">
    <div id="menu">
      <h1 class="screen-title">REFLEX<br>PING PONG</h1>
      <div class="subtitle">elige tu raqueta</div>
      <div class="choice-row">
        <button class="choice-btn" id="btn-cyan">CIAN</button>
        <button class="choice-btn" id="btn-magenta">MAGENTA</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="game"></canvas>
      <div id="serve-hint">toca o presiona espacio para sacar</div>
    </div>
  </div>

  <div class="side-panel" id="panel-right">
    <div class="speed-label">VELOCIDAD</div>
    <div class="speed-meter">
      <div class="speed-fill" id="speed-fill"></div>
    </div>
    <div class="deco-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

<script>
(function() {
  const COLOR_BG = 'hsl(240, 100%, 15%)';
  const COLOR_LINE = 'hsl(240, 100%, 85%)';
  const COLOR_BALL = 'hsl(60, 100%, 50%)';
  const COLOR_CYAN = 'hsl(180, 100%, 50%)';
  const COLOR_MAGENTA = 'hsl(300, 100%, 50%)';

  const menu = document.getElementById('menu');
  const wrap = document.getElementById('canvas-wrap');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreCyanEl = document.getElementById('score-cyan');
  const scoreMagentaEl = document.getElementById('score-magenta');
  const speedFillEl = document.getElementById('speed-fill');
  const serveHintEl = document.getElementById('serve-hint');

  let playerColor = null; // 'cyan' | 'magenta'
  let W, H;
  const PADDLE_W_RATIO = 0.28; // fraction of screen width
  const PADDLE_H = 8;
  const PADDLE_MARGIN = 24;
  const BALL_RADIUS = 8;
  const COURT_MARGIN = 16;
  const MAX_SPEED = 22;

  let paddleTop, paddleBottom, ball, keys = {};
  let servingSide = null; // 'cyan' | 'magenta' - who is about to serve
  let gameState = 'idle'; // 'serving' | 'playing'
  let scores = { cyan: 0, magenta: 0 };
  let trail = [];
  const TRAIL_LENGTH = 10;
  let aiServeTimer = null;

  function resize() {
    W = canvas.parentElement.clientWidth;
    H = canvas.parentElement.clientHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resize);

  function updateScoreDisplay() {
    scoreCyanEl.textContent = scores.cyan;
    scoreMagentaEl.textContent = scores.magenta;
  }

  function attachBallToServer() {
    const paddle = servingSide === 'cyan' ? paddleTop : paddleBottom;
    ball.x = paddle.x + paddle.w / 2;
    if (servingSide === 'cyan') {
      ball.y = paddle.y + paddle.h + ball.radius;
    } else {
      ball.y = paddle.y - ball.radius;
    }
    ball.vx = 0;
    ball.vy = 0;
  }

  function startServe(side) {
    servingSide = side;
    gameState = 'serving';
    trail = [];
    attachBallToServer();

    const isPlayerServing = side === playerColor;
    serveHintEl.style.display = isPlayerServing ? 'block' : 'none';
    positionServeHint();

    if (!isPlayerServing) {
      clearTimeout(aiServeTimer);
      aiServeTimer = setTimeout(() => {
        if (gameState === 'serving' && servingSide === side) fireServe();
      }, 700 + Math.random() * 500);
    }
  }

  function positionServeHint() {
    const paddle = servingSide === 'cyan' ? paddleTop : paddleBottom;
    if (servingSide === 'cyan') {
      serveHintEl.style.top = (paddle.y + paddle.h + 20) + 'px';
    } else {
      serveHintEl.style.top = (paddle.y - 34) + 'px';
    }
  }

  function fireServe() {
    if (gameState !== 'serving') return;
    clearTimeout(aiServeTimer);
    gameState = 'playing';
    serveHintEl.style.display = 'none';

    const speed = Math.max(5, W * 0.008);
    const angle = (Math.random() * 0.5 - 0.25);
    const direction = servingSide === 'cyan' ? 1 : -1;

    ball.vx = speed * angle * 3;
    ball.vy = speed * direction;
  }

  function initGame() {
    resize();
    const paddleW = W * PADDLE_W_RATIO;
    paddleTop = { x: W / 2 - paddleW / 2, w: paddleW, h: PADDLE_H, y: COURT_MARGIN + PADDLE_MARGIN, speed: W * 0.014 };
    paddleBottom = { x: W / 2 - paddleW / 2, w: paddleW, h: PADDLE_H, y: H - COURT_MARGIN - PADDLE_MARGIN - PADDLE_H, speed: W * 0.014 };
    scores = { cyan: 0, magenta: 0 };
    updateScoreDisplay();
    ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, radius: BALL_RADIUS };
    startServe(Math.random() < 0.5 ? 'cyan' : 'magenta');
  }

  // Controls: player controls one paddle via pointer / arrow keys, the other side is AI
  let pointerX = null;

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    pointerX = e.clientX - rect.left;
  });
  canvas.addEventListener('touchmove', (e) => {
    const rect = canvas.getBoundingClientRect();
    pointerX = e.touches[0].clientX - rect.left;
    e.preventDefault();
  }, { passive: false });

  function tryFire() {
    if (gameState === 'serving' && servingSide === playerColor) fireServe();
  }
  canvas.addEventListener('click', tryFire);
  canvas.addEventListener('touchstart', tryFire, { passive: true });
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ') tryFire();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  // ---- Audio: synthesized "pong" hit sound ----
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playHit(intensity) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const baseFreq = 520 + clamp(intensity, 0, 1) * 260;

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.09);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.5, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);

    const click = audioCtx.createOscillator();
    click.type = 'square';
    click.frequency.setValueAtTime(baseFreq * 2.4, now);
    const clickGain = audioCtx.createGain();
    clickGain.gain.setValueAtTime(0.15, now);
    clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);

    osc.connect(gain).connect(audioCtx.destination);
    click.connect(clickGain).connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.12);
    click.start(now);
    click.stop(now + 0.03);
  }

  function playWallTick() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(660, now + 0.05);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.07);
  }

  function playScoreSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [0, 0.09].forEach((delay, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440 + i * 220, now + delay);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.3, now + delay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.16);
    });
  }

  function update() {
    const playerPaddle = playerColor === 'cyan' ? paddleTop : paddleBottom;
    const aiPaddle = playerColor === 'cyan' ? paddleBottom : paddleTop;

    const minX = COURT_MARGIN;
    const maxX = W - COURT_MARGIN;

    // player control
    if (pointerX !== null) {
      playerPaddle.x = clamp(pointerX - playerPaddle.w / 2, minX, maxX - playerPaddle.w);
    }
    if (keys['ArrowLeft']) playerPaddle.x = clamp(playerPaddle.x - playerPaddle.speed, minX, maxX - playerPaddle.w);
    if (keys['ArrowRight']) playerPaddle.x = clamp(playerPaddle.x + playerPaddle.speed, minX, maxX - playerPaddle.w);

    // AI tracking with slight lag (only relevant target when playing or when AI must position before serving)
    const aiTarget = gameState === 'playing' ? ball.x : (aiPaddle.x + aiPaddle.w / 2);
    const targetX = aiTarget - aiPaddle.w / 2;
    const aiSpeed = aiPaddle.speed * 0.85;
    if (Math.abs(aiPaddle.x - targetX) > aiSpeed) {
      aiPaddle.x += aiPaddle.x < targetX ? aiSpeed : -aiSpeed;
    }
    aiPaddle.x = clamp(aiPaddle.x, minX, maxX - aiPaddle.w);

    if (gameState === 'serving') {
      attachBallToServer();
      positionServeHint();
      speedFillEl.style.height = '0%';
      return;
    }

    // ball movement
    ball.x += ball.vx;
    ball.y += ball.vy;

    // record trail position
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > TRAIL_LENGTH) trail.shift();

    // speed meter
    const currentSpeed = Math.hypot(ball.vx, ball.vy);
    speedFillEl.style.height = clamp((currentSpeed / MAX_SPEED) * 100, 0, 100) + '%';

    // wall bounce (left/right) - bounded by court margin
    if (ball.x - ball.radius <= COURT_MARGIN) {
      ball.x = COURT_MARGIN + ball.radius;
      ball.vx *= -1;
      playWallTick();
    } else if (ball.x + ball.radius >= W - COURT_MARGIN) {
      ball.x = W - COURT_MARGIN - ball.radius;
      ball.vx *= -1;
      playWallTick();
    }

    // paddle collision - top
    if (ball.vy < 0 &&
        ball.y - ball.radius <= paddleTop.y + paddleTop.h &&
        ball.y - ball.radius >= paddleTop.y &&
        ball.x >= paddleTop.x && ball.x <= paddleTop.x + paddleTop.w) {
      ball.y = paddleTop.y + paddleTop.h + ball.radius;
      ball.vy *= -1.03;
      const hitPos = (ball.x - (paddleTop.x + paddleTop.w / 2)) / (paddleTop.w / 2);
      ball.vx += hitPos * 2.5;
      const speed = Math.hypot(ball.vx, ball.vy);
      playHit(clamp(speed / 20, 0, 1));
    }

    // paddle collision - bottom
    if (ball.vy > 0 &&
        ball.y + ball.radius >= paddleBottom.y &&
        ball.y + ball.radius <= paddleBottom.y + paddleBottom.h &&
        ball.x >= paddleBottom.x && ball.x <= paddleBottom.x + paddleBottom.w) {
      ball.y = paddleBottom.y - ball.radius;
      ball.vy *= -1.03;
      const hitPos = (ball.x - (paddleBottom.x + paddleBottom.w / 2)) / (paddleBottom.w / 2);
      ball.vx += hitPos * 2.5;
      const speed = Math.hypot(ball.vx, ball.vy);
      playHit(clamp(speed / 20, 0, 1));
    }

    // point lost: ball passes top -> cyan lost, magenta scores. ball passes bottom -> magenta lost, cyan scores.
    if (ball.y < -50) {
      scores.magenta += 1;
      updateScoreDisplay();
      playScoreSound();
      startServe('cyan');
    } else if (ball.y > H + 50) {
      scores.cyan += 1;
      updateScoreDisplay();
      playScoreSound();
      startServe('magenta');
    }
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, W, H);

    // court outline (like a ping pong table border)
    ctx.strokeStyle = COLOR_LINE;
    ctx.lineWidth = 3;
    ctx.strokeRect(
      COURT_MARGIN, COURT_MARGIN,
      W - COURT_MARGIN * 2, H - COURT_MARGIN * 2
    );

    // continuous center line (net)
    ctx.beginPath();
    ctx.moveTo(COURT_MARGIN, H / 2);
    ctx.lineTo(W - COURT_MARGIN, H / 2);
    ctx.stroke();

    // paddles - elongated rounded shape
    const topRadius = paddleTop.h / 2;
    ctx.fillStyle = COLOR_CYAN;
    roundedRect(paddleTop.x, paddleTop.y, paddleTop.w, paddleTop.h, topRadius);
    ctx.fill();

    const bottomRadius = paddleBottom.h / 2;
    ctx.fillStyle = COLOR_MAGENTA;
    roundedRect(paddleBottom.x, paddleBottom.y, paddleBottom.w, paddleBottom.h, bottomRadius);
    ctx.fill();

    // ball trail (speed effect)
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      const progress = i / trail.length;
      const alpha = progress * 0.35;
      const r = ball.radius * (0.4 + progress * 0.6);
      ctx.beginPath();
      ctx.fillStyle = `hsla(60, 100%, 50%, ${alpha})`;
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ball - circle
    ctx.fillStyle = COLOR_BALL;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function startGame(color) {
    ensureAudio();
    playerColor = color;
    menu.style.display = 'none';
    wrap.style.display = 'block';
    initGame();
    requestAnimationFrame(loop);
  }

  document.getElementById('btn-cyan').addEventListener('click', () => startGame('cyan'));
  document.getElementById('btn-magenta').addEventListener('click', () => startGame('magenta'));
})();
</script>

</body>
</html>
